# Field-of-use seed hierarchy. Gate 1 turns this into the SKOS concept scheme.
# Each top concept is a T2 portal category. A grant for a broader concept covers every
# narrower concept beneath it, so editing this hierarchy changes legal outcomes.
# keywords map patent titles to a narrower concept when no T2 category is available.
aerospace:
  label: Aerospace
  narrower:
    aircraft-structures: {label: Aircraft structures, keywords: [aircraft, wing, airframe, fuselage, rotor]}
    spacecraft-systems: {label: Spacecraft systems, keywords: [spacecraft, satellite, orbit, launch, space]}
    unmanned-aircraft: {label: Unmanned aircraft, keywords: [unmanned, uav, drone, autonomous flight]}
communications:
  label: Communications
  narrower:
    rf-antennas: {label: RF antennas, keywords: [antenna, radio, rf, microwave]}
    optical-communications: {label: Optical communications, keywords: [optical communication, laser communication, free-space]}
electrical-and-electronics:
  label: Electrical and Electronics
  narrower:
    power-electronics: {label: Power electronics, keywords: [converter, inverter, circuit, transistor]}
    wiring-and-insulation: {label: Wiring and insulation, keywords: [wire, wiring, insulation, cable]}
environment:
  label: Environment
  narrower:
    remediation: {label: Environmental remediation, keywords: [remediation, contaminant, groundwater, soil]}
    emissions-monitoring: {label: Emissions monitoring, keywords: [emission, pollutant, gas detection]}
