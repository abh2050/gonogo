# Territory seed hierarchy with ISO 3166-1 alpha-2 codes. Gate 1 turns it into SKOS.
# A grant for a region covers every country beneath it.
WORLD:
  label: Worldwide
  narrower:
    NORTH-AMERICA:
      label: North America
      narrower: {US: United States, CA: Canada, MX: Mexico}
    EUROPE:
      label: Europe
      narrower: {GB: United Kingdom, DE: Germany, FR: France, SE: Sweden, IT: Italy, NL: Netherlands}
    ASIA-PACIFIC:
      label: Asia Pacific
      narrower: {JP: Japan, KR: Republic of Korea, AU: Australia, IN: India, CN: China, SG: Singapore}
    MIDDLE-EAST:
      label: Middle East
      narrower: {AE: United Arab Emirates, IL: Israel}
