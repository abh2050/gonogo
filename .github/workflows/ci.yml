name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python checks and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy gonogo ingest synth kg rules er agent api authz service eval pgraph
      # Offline suite: shapes, competency questions on rdflib, the graph build, and the ontology checks.
      - run: uv run pytest

  ontology:
    name: ROBOT, HermiT, and generated documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      # Consistency, unsatisfiable classes, and three datasets that HermiT must reject.
      - run: uv run pytest -m robot
      # The reference documentation is generated, so the committed copy must match.
      - run: uv run python -m kg.docs
      - run: git diff --exit-code docs/ontology ui/public/ontology

  fuseki:
    name: Competency questions on Fuseki
    runs-on: ubuntu-latest
    services:
      fuseki:
        image: stain/jena-fuseki:5.1.0
        ports:
          - 3030:3030
        env:
          ADMIN_PASSWORD: gonogo-local
          FUSEKI_DATASET_1: gonogo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Wait for Fuseki
        run: until curl -fs http://localhost:3030/$/ping; do sleep 2; done
      - run: uv run pytest -m docker -k fuseki
      - name: Build and load the full graph
        run: uv run python -m kg all
      # With the full graph loaded, every rule decision over HTTP must match the in-memory engine.
      - run: uv run pytest -m docker -k sparql_store
      # ADR 0003: R2 in Cypher on Neo4j returns the same grants as R2 in SPARQL.
      - name: Start Neo4j
        run: docker run -d --name neo4j -p 7687:7687 -e NEO4J_AUTH=neo4j/gonogo-local neo4j:5.26-community
      - name: Wait for Neo4j
        run: until docker logs neo4j 2>&1 | grep -q "Started"; do sleep 2; done
      - run: uv run pytest -m docker tests/integration/test_pgraph.py
      # The public demo serves a committed snapshot of the graph, so it must match a fresh build.
      - run: git diff --exit-code api/snapshot

  ontop:
    name: Ontop applies the R2RML mapping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      # PostgreSQL and Ontop run as containers. The test compares Ontop's triples with the graph and answers a
      # finance question as SPARQL over the verdict table.
      - run: uv run pytest -m docker tests/integration/test_ontop.py

  ui:
    name: UI build and data drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: uv sync --frozen
      # The visualizations read JSON exported from the ontology and the built graph.
      - run: uv run python -m kg.export_viz
      # The benchmark's tables and chart data are scored from the committed runs, so they must not drift.
      - run: uv run python -m eval.score
      - run: uv run python -m eval.report
      - run: git diff --exit-code ui/public/data eval/results.json eval/results.md
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
