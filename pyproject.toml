[project]
name = "gonogo"
version = "0.1.0"
description = "Ontology-grounded patent license clearance for NASA technology transfer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rdflib>=7.0",
  "reportlab>=4.2",
  "pypdf>=4.2",
  "boto3[crt]>=1.34",
  "neo4j>=5.20",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10", "respx>=0.21", "types-PyYAML", "boto3-stubs[sts,bedrock]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gonogo", "ingest", "synth"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # word lists read better as one split string

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: makes live calls to public data APIs",
  "docker: needs docker compose services running",
  "aws: makes read-only AWS calls with profile awsnew",
]
addopts = "-m 'not network and not docker and not aws'"
